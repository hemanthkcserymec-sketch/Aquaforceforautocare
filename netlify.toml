[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

# --- Rewrites & Redirects ---
[[redirects]]
  from = "/api/*"
  to = "/aquaforceforautocare/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/aquaforceforgigworkers/*"
  to = "https://aquaforceforgigworkers.netlify.app/aquaforceforgigworkers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/aquaforceforservicepartner/*"
  to = "https://aquaforceforgigworkers.netlify.app/aquaforceforgigworkers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/servicepartner/*"
  to = "https://aquaforceforgigworkers.netlify.app/aquaforceforgigworkers/:splat"
  status = 200
  force = true

# --- CDN Caching Headers for Cloudflare & Edge ---
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
